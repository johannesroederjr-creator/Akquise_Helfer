name: Deploy to Strato

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-strato
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync akquise-helfer-website to docs
        run: rsync -a --delete --exclude .git akquise-helfer-website/ docs/

      - name: Upload to Strato via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.5
        with:
          server: ${{ secrets.STRATO_SFTP_HOST }}
          username: ${{ secrets.STRATO_SFTP_USER }}
          password: ${{ secrets.STRATO_SFTP_PASSWORD }}
          port: 22
          local_path: ./docs/**
          remote_path: ${{ secrets.STRATO_SFTP_PATH }}
          sftp_only: true
