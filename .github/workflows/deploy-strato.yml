name: Deploy to Strato

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-strato
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync akquise-helfer-website to docs
        run: rsync -a --delete --exclude .git akquise-helfer-website/ docs/

      - name: Upload to Strato via SFTP
        env:
          SFTP_HOST: ${{ secrets.STRATO_SFTP_HOST }}
          SFTP_USER: ${{ secrets.STRATO_SFTP_USER }}
          SFTP_PASS: ${{ secrets.STRATO_SFTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lftp
          lftp <<EOF
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=no"
          set net:timeout 30
          set net:max-retries 3
          set mirror:parallel-transfer-count 4
          open -u "${SFTP_USER}","${SFTP_PASS}" sftp://${SFTP_HOST}:22
          mirror -R --verbose --parallel=4 docs/ .
          bye
          EOF
